services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"

  cloudflared:
    profiles: ["remote"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-api:salvage-local
    environment:
      DOGRAH_GAME_COMPANION_ENABLED: "${DOGRAH_GAME_COMPANION_ENABLED:-0}"
      DOGRAH_GAME_COMPANION_TOKEN: "${DOGRAH_GAME_COMPANION_TOKEN:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      DOGRAH_GAME_COMPANION_LLM_MODEL: "${DOGRAH_GAME_COMPANION_LLM_MODEL:-deepseek/deepseek-v4-flash}"
      DOGRAH_GAME_COMPANION_STT_MODEL: "${DOGRAH_GAME_COMPANION_STT_MODEL:-qwen/qwen3-asr-flash-2026-02-10}"
      DOGRAH_GAME_COMPANION_TTS_MODEL: "${DOGRAH_GAME_COMPANION_TTS_MODEL:-x-ai/grok-voice-tts-1.0}"
      DOGRAH_GAME_COMPANION_TTS_VOICE: "${DOGRAH_GAME_COMPANION_TTS_VOICE:-eve}"
      DOGRAH_GAME_COMPANION_TTS_PROVIDER: "${DOGRAH_GAME_COMPANION_TTS_PROVIDER:-openrouter}"
      FISH_API_KEY: "${FISH_API_KEY:-}"
      DOGRAH_GAME_COMPANION_FISH_BASE_URL: "${DOGRAH_GAME_COMPANION_FISH_BASE_URL:-https://api.fish.audio}"
      DOGRAH_GAME_COMPANION_FISH_MODEL: "${DOGRAH_GAME_COMPANION_FISH_MODEL:-s2.1-pro-free}"
      DOGRAH_GAME_COMPANION_FISH_REFERENCE_ID: "${DOGRAH_GAME_COMPANION_FISH_REFERENCE_ID:-}"
      DOGRAH_GAME_COMPANION_FISH_SAMPLE_RATE: "${DOGRAH_GAME_COMPANION_FISH_SAMPLE_RATE:-24000}"
      DOGRAH_GAME_COMPANION_FISH_LATENCY: "${DOGRAH_GAME_COMPANION_FISH_LATENCY:-balanced}"
      DOGRAH_GAME_COMPANION_FISH_CHUNK_LENGTH: "${DOGRAH_GAME_COMPANION_FISH_CHUNK_LENGTH:-150}"
      DOGRAH_GAME_COMPANION_FISH_REQUEST_TIMEOUT_SECONDS: "${DOGRAH_GAME_COMPANION_FISH_REQUEST_TIMEOUT_SECONDS:-30}"
      DOGRAH_GAME_COMPANION_FISH_FALLBACK_COOLDOWN_SECONDS: "${DOGRAH_GAME_COMPANION_FISH_FALLBACK_COOLDOWN_SECONDS:-60}"
      ENABLE_TELEMETRY: "false"
    ports: !override
      - "127.0.0.1:8000:8000"
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
